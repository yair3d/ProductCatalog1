<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle de Producto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
    <div class="container mt-4">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header d-flex justify-content-between align-items-center">
                        <h2 class="mb-0"><i class="bi bi-box-seam"></i> Detalle del Producto</h2>
                        <div>
                            <button id="editBtn" class="btn btn-primary me-2">
                                <i class="bi bi-pencil"></i> Editar
                            </button>
                            <button id="backBtn" class="btn btn-secondary">
                                <i class="bi bi-arrow-left"></i> Volver
                            </button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">ID:</div>
                            <div class="col-md-9" id="detailId"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Nombre:</div>
                            <div class="col-md-9" id="detailName"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Descripción:</div>
                            <div class="col-md-9" id="detailDescription"></div>
                        </div>
                        <div class="row mb-3">
                            <div class="col-md-3 fw-bold">Precio:</div>
                            <div class="col-md-9" id="detailPrice"></div>
                        </div>
                        <div class="row">
                            <div class="col-md-3 fw-bold">Stock:</div>
                            <div class="col-md-9" id="detailStock"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (productId) {
                // Cargar detalles del producto
                getProductById(productId)
                    .then(product => {
                        document.getElementById('detailId').textContent = product.id;
                        document.getElementById('detailName').textContent = product.name;
                        document.getElementById('detailDescription').textContent = product.description || 'No hay descripción';
                        document.getElementById('detailPrice').textContent = `$${product.price.toFixed(2)}`;
                        document.getElementById('detailStock').textContent = product.stock;

                        // Configurar botón editar
                        document.getElementById('editBtn').addEventListener('click', function () {
                            window.location.href = `product-form.html?id=${productId}`;
                        });
                    })
                    .catch(error => {
                        console.error('Error cargando detalles:', error);
                        showNotification('Error al cargar detalles del producto', 'danger');
                        setTimeout(() => window.location.href = 'index.html', 2000);
                    });
            } else {
                showNotification('No se especificó un producto', 'danger');
                setTimeout(() => window.location.href = 'index.html', 2000);
            }

            // Configurar botón volver
            document.getElementById('backBtn').addEventListener('click', function () {
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
